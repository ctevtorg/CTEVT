<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTEVT Certificate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .certificate-container {
            width: 100%;
            max-width: 800px;
            background-color: white;
            padding: 60px 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 3px solid #003da5;
        }
        
        .header {
            margin-bottom: 30px;
            border-bottom: 2px solid #003da5;
            padding-bottom: 20px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .star-logo {
            width: 70px;
            height: 70px;
            border: 3px solid #003da5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            color: #003da5;
        }
        
        .organization-title {
            font-size: 28px;
            font-weight: bold;
            color: #003da5;
            margin-bottom: 8px;
        }
        
        .organization-subtitle {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }
        
        .content {
            margin: 40px 0;
            text-align: left;
        }
        
        .info-row {
            display: flex;
            margin-bottom: 25px;
            align-items: center;
        }
        
        .info-label {
            font-weight: bold;
            color: #003da5;
            min-width: 150px;
            font-size: 16px;
        }
        
        .info-value {
            font-size: 16px;
            color: #333;
            flex: 1;
            padding-left: 20px;
        }
        
        .divider {
            width: 40px;
            height: 2px;
            background-color: #003da5;
            display: inline-block;
            margin: 0 10px;
        }
        
        .status-badge {
            display: inline-block;
            background-color: #4caf50;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
        
        .footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid #003da5;
            color: #666;
            font-size: 12px;
        }
        
        @media print {
            body {
                background-color: white;
            }
            
            .certificate-container {
                box-shadow: none;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="certificate-container">
        <div class="header">
            <div class="logo">
                <div class="star-logo">★</div>
            </div>
            <div class="organization-title">Council for Techinical Education and Vocational Training</div>
            <div class="organization-subtitle">Sanothimi, Kathmandu, Nepal</div>
        </div>
        
        <div class="content">
            <div class="info-row">
                <span class="info-label">Student Name :</span>
                <span class="info-value">Atish Kumar Mandal</span>
            </div>
            
            <div class="info-row">
                <span class="info-label">Course :</span>
                <span class="info-value">Diploma in civil Engineering</span>
            </div>
            
            <div class="info-row">
                <span class="info-label">Status :</span>
                <span class="info-value">
                    <span class="status-badge">Approved</span>
                </span>
            </div>
        </div>
        
        <div class="footer">
            <p>&copy; 2024 Council for Techinical Education and Vocational Training. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
