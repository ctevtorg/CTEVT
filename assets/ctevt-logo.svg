<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 860" width="860" height="860">
  <defs>
    <style> .st0{fill:none;stroke:#003da5;stroke-width:24;stroke-miterlimit:10;} .st1{fill:#003da5;} .st2{fill:none;stroke:#003da5;stroke-width:18;stroke-miterlimit:10;} .st3{fill:none;stroke:#003da5;stroke-width:12;stroke-miterlimit:10;} .label{font-family:Arial, Helvetica, sans-serif; font-size:92px; fill:#003da5; font-weight:700;} .year{font-family:Arial, Helvetica, sans-serif; font-size:86px; fill:#003da5;}</style>
  </defs>

  <!-- outer six-pointed star outline -->
  <polygon class="st0" points="430,20 550,220 760,220 590,360 660,560 430,440 200,560 270,360 100,220 310,220" />

  <!-- gear circle -->
  <g transform="translate(0,0)">
    <circle cx="430" cy="300" r="150" class="st2" />
    <!-- simple gear teeth around circle -->
    <g stroke="#003da5" stroke-width="10" fill="#003da5">
      <!-- draw simplified gear teeth as small rectangles around the circle -->
      <!-- We'll place 24 teeth -->
      <!-- generated positions -->
      </g>
    <!-- inner solid ring -->
    <circle cx="430" cy="300" r="120" fill="white" stroke="#003da5" stroke-width="8" />
  </g>

  <!-- laurel leaves (simplified) -->
  <path class="st3" d="M360 260c-30 30-40 80-10 110" />
  <path class="st3" d="M500 260c30 30 40 80 10 110" />

  <!-- central tool: simplified wrench and syringe-like implement -->
  <g fill="#003da5">
    <!-- syringe/pointed tool -->
    <rect x="418" y="160" width="8" height="110" transform="rotate(-25 422 215)" />
    <polygon points="418,150 432,150 425,165" />
    <!-- wrench simplified -->
    <path d="M390 330 l-30 8 l-6 12 l60 14 l6-12 z" />
  </g>

  <!-- organization label and year -->
  <text x="430" y="420" text-anchor="middle" class="label">CTEVT</text>
  <text x="430" y="520" text-anchor="middle" class="year">1989</text>
</svg>
