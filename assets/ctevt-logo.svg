<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700" role="img" aria-label="CTEVT logo">
  <defs>
    <style>
      .stroke { fill: none; stroke: #0B5ED7; stroke-linecap: round; stroke-linejoin: round; }
      .thick { stroke-width: 8; }
      .med { stroke-width: 6; }
      .thin { stroke-width: 4; }
      .text { fill: #0B5ED7; font-family: "Arial", "Helvetica", sans-serif; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <!-- Hexagram (two overlapping triangles) -->
  <g transform="translate(0,30)">
    <polygon class="stroke med" points="300,40 420,270 180,270" />
    <polygon class="stroke med" points="300,420 120,190 480,190" />
  </g>

  <!-- Central circular emblem with gear teeth -->
  <g transform="translate(0,30)">
    <!-- gear teeth (12 teeth) approximated by rectangles rotated around center -->
    <g transform="translate(300,230)">
      <!-- outer gear ring -->
      <circle r="90" class="stroke med" />
      <!-- teeth -->
      <g>
        <rect x="-6" y="-110" width="12" height="22" class="stroke thin" fill="#0B5ED7" />
        <rect x="-6" y="88" width="12" height="22" class="stroke thin" fill="#0B5ED7" transform="rotate(180)"/>
        <g id="tooth">
          <rect x="-6" y="-110" width="12" height="22" class="stroke thin" fill="#0B5ED7"/>
        </g>
        <!-- replicate rotated teeth -->
        <g transform="rotate(30)"><use href="#tooth"/></g>
        <g transform="rotate(60)"><use href="#tooth"/></g>
        <g transform="rotate(90)"><use href="#tooth"/></g>
        <g transform="rotate(120)"><use href="#tooth"/></g>
        <g transform="rotate(150)"><use href="#tooth"/></g>
        <g transform="rotate(180)"><use href="#tooth"/></g>
        <g transform="rotate(210)"><use href="#tooth"/></g>
        <g transform="rotate(240)"><use href="#tooth"/></g>
        <g transform="rotate(270)"><use href="#tooth"/></g>
        <g transform="rotate(300)"><use href="#tooth"/></g>
        <g transform="rotate(330)"><use href="#tooth"/></g>
      </g>

      <!-- inner plain circular ring -->
      <circle r="62" class="stroke med" />

      <!-- Sword / dagger (vertical, pointing up) -->
      <g transform="translate(0, -6)">
        <path class="stroke thick" d="M0,32 L0,-48" /> <!-- blade shaft -->
        <path class="stroke med" d="M-18,-26 L18,-26 L0,-48 Z" /> <!-- tip -->
        <rect x="-20" y="-12" width="40" height="6" class="stroke med" /> <!-- cross-guard -->
        <rect x="-10" y="34" width="20" height="10" rx="2" class="stroke med" /> <!-- handle butt -->
      </g>

      <!-- Crossed wrench, behind the sword (rotated) -->
      <g transform="rotate(30)">
        <path class="stroke med" d="M-6,22 L-6,86 C-6,90 6,90 6,86 L6,22" /> <!-- handle -->
        <path class="stroke med" d="M-30,12 C-22,6 -6,6 6,18" /> <!-- open jaw curve -->
        <path class="stroke med" d="M-32,10 L-18,-6" /> <!-- jaw tip -->
      </g>
      <g transform="rotate(-30)">
        <path class="stroke med" d="M-6,22 L-6,86 C-6,90 6,90 6,86 L6,22" />
        <path class="stroke med" d="M-30,12 C-22,6 -6,6 6,18" />
        <path class="stroke med" d="M-32,10 L-18,-6" />
      </g>

      <!-- Laurel / wheat-like branches (left and right) -->
      <g transform="translate(-72,18) scale(1,1)">
        <path class="stroke thin" d="M0,40 C-28,30 -40,6 -34,-18" />
        <!-- leaves -->
        <path class="stroke thin" d="M-6,26 C-16,22 -24,14 -20,8" />
        <path class="stroke thin" d="M-10,12 C-20,8 -28,0 -24,-6" />
        <path class="stroke thin" d="M-14,-2 C-24,-6 -30,-16 -26,-22" />
      </g>
      <g transform="translate(72,18) scale(-1,1)">
        <path class="stroke thin" d="M0,40 C-28,30 -40,6 -34,-18" />
        <path class="stroke thin" d="M-6,26 C-16,22 -24,14 -20,8" />
        <path class="stroke thin" d="M-10,12 C-20,8 -28,0 -24,-6" />
        <path class="stroke thin" d="M-14,-2 C-24,-6 -30,-16 -26,-22" />
      </g>
    </g>
  </g>

  <!-- CTEVT text (bold blue) centered, spanning middle band of star -->
  <text x="300" y="490" class="text" font-size="56">CTEVT</text>

  <!-- Founding year 1989 in the lower point -->
  <text x="300" y="560" class="text" font-size="36">1989</text>
</svg>
